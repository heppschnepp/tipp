version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: tipp-postgres
    environment:
      - POSTGRES_USER=lportal
      - POSTGRES_PASSWORD=lportal
      - POSTGRES_DB=tipp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lportal"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tipp-server
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_SERVER=postgres
      - DB_PORT=5432
      - DB_NAME=tipp
      - DB_USER=lportal
      - DB_PASSWORD=lportal
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=7d
      - FLAGS_DIR=/app/public/flags
      - WC2026_API_KEY=${WC2026_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./client/public/flags:/app/public/flags:ro
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tipp-client
    environment:
      - VITE_API_URL=http://server:3001
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
